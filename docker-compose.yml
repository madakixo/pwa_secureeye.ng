version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: secureeye
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secureeye-network

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/secureeye
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_test_mock}
      WHATSAPP_TO: ${WHATSAPP_TO}
      CALLMEBOT_KEY: ${CALLMEBOT_KEY}
    depends_on:
      - db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - secureeye-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./pwa:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - secureeye-network

  # This service is here just to ensure the detector image is built
  detector:
    build: ./detector
    image: secureeye-detector:latest
    command: ["echo", "Detector image built"]
    networks:
      - secureeye-network

networks:
  secureeye-network:
    name: secureeye-network

volumes:
  postgres_data:
